[package]
name = "lsys-web"
version = "0.1.0"
authors = ["Sameer Puri <crates@purisa.me>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.23.1"
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-logger = "0.7"
lsys = { path = "../lib" }
rust_decimal = { version = "1.43.0", default-features = false, features = [
    "std",
    "maths",
] }
svgtypes = "0.16.1"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Clipboard", "MouseEvent", "Navigator"] }
